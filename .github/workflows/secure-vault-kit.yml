name: SecureVaultKit

on:
  pull_request:
    branches:
      - develop
    paths:
      - "packages/SecureVaultKit/**"
      - ".github/workflows/secure-vault-kit.yml"
  push:
    branches:
      - develop
      - 'feature/**'
      - 'hotfix/**'
      - 'bugfix/**'
    paths:
      - "packages/SecureVaultKit/**"
      - ".github/workflows/secure-vault-kit.yml"

jobs:
  swift-test:
    name: Swift Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test SecureVaultKit
        working-directory: packages/SecureVaultKit
        run: swift test
